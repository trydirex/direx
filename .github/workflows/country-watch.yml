# SPDX-License-Identifier: AGPL-3.0-only
# Once a week, read each source behind the cold-email skill's country table and open an issue for
# a person when one changes, or when rows are due their 180-day re-read. It never edits the table.
name: country-watch

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # Only the repository's own token, to read and write the watch's issues. No other key.
      - run: bun scripts/country-watch.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
