# SPDX-License-Identifier: AGPL-3.0-only
# Publishes the server image that deploy/compose/install.sh pulls. Runs only when a person pushes a
# version tag such as v0.1.0; nothing else publishes it.
name: release-image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/trydirex/direx:${{ github.ref_name }}
            ghcr.io/trydirex/direx:latest
