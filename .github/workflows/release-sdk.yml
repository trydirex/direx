# SPDX-License-Identifier: AGPL-3.0-only
# Publishes @trydirex/plugin-sdk to npm when a person pushes a version tag such as v0.1.0, but only
# when the SDK's own version (packages/plugin-sdk/package.json) is not on npm yet. The SDK keeps its
# own version because plugins report it and the host gates fields on it, so most releases skip.
name: release-sdk

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - id: version
        run: |
          v=$(node -p 'require("./packages/plugin-sdk/package.json").version')
          if npm view "@trydirex/plugin-sdk@$v" version >/dev/null 2>&1; then
            echo "@trydirex/plugin-sdk@$v is already on npm; nothing to publish"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish
        run: bun install --frozen-lockfile
      # Packs the tarball and proves it starts a worker in clean Node and Bun projects first.
      - if: steps.version.outputs.publish
        run: bun run sdk:pack --out sdk-dist
      - if: steps.version.outputs.publish
        run: npm publish sdk-dist/*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
