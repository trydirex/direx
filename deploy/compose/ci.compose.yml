# CI only: a mail server on the install's Compose network, so doctor's mail check has a real SMTP
# login to make. Added with COMPOSE_FILE=compose.yml:ci.compose.yml (.github/workflows/install.yml).
services:
  greenmail:
    image: greenmail/standalone:2.1.14
    environment:
      GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=alice:secret@example.com -Dgreenmail.users.login=email
  direx:
    depends_on:
      - greenmail
